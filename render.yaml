# Render blueprint for the TaskFlow backend (Express + SQLite + node-cron).
#
# How to use it: push this repo to GitHub, then in the Render dashboard choose
# "New +" -> "Blueprint" and pick this repository. Render reads this file and
# creates the service below.
#
# SQLite needs a real file that survives restarts and redeploys, so this
# blueprint attaches a persistent disk and stores the database on it. Disks are
# a paid feature on Render (the "starter" plan below), which is why this service
# is not on the free plan.
services:
  - type: web
    name: taskflow-api
    runtime: node
    plan: starter
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      # Node version and production mode.
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production

      # The exact frontend origin allowed to call the API (your Vercel URL).
      # You will be asked for this value during the first deploy.
      - key: CLIENT_URL
        sync: false

      # Render generates a strong random secret for the login cookie, so it is
      # never written in this file or in Git.
      - key: JWT_SECRET
        generateValue: true

      # Gmail SMTP credentials. You will be asked for these during deploy.
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_APP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false

      # Keep the SQLite database on the persistent disk mounted below.
      - key: DB_PATH
        value: /var/data/todo.db

      # Deadline/reminder calculations use the server's local timezone. Set this
      # to your own timezone so reminders fire at the right local time.
      - key: TZ
        sync: false

    disk:
      name: taskflow-data
      mountPath: /var/data
      sizeGB: 1
